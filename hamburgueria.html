<!-- ============================================================
     ESTILOS
     As cores e medidas principais ficam nas variáveis em :root
     ============================================================ -->
<style>

  :root {
    color-scheme: dark;
    --fundo: #0c0c0e;
    --superficie: #151518;
    --superficie-2: #1d1d22;
    --borda: rgba(255, 255, 255, .09);
    --borda-forte: rgba(255, 255, 255, .18);
    --texto: #f5efe4;
    --cinza: #a8a296;          /* contraste AA sobre o fundo escuro */
    --ouro: #d4a853;
    --ouro-claro: #f2d28f;
    --ouro-escuro: #a97f2f;
    --grad-ouro: linear-gradient(135deg, #f2d28f 0%, #d4a853 50%, #b8872f 100%);
    --erro: #ff7a7a;
    --raio: 18px;
    --altura-abas: 56px;
    --serifa: "Playfair Display", Georgia, "Times New Roman", serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; scroll-padding-top: calc(var(--altura-abas) + 8px); -webkit-text-size-adjust: 100%; background: var(--fundo); }
  body {
    font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #2a2013 0%, transparent 60%), var(--fundo);
    background-attachment: fixed;
    color: var(--texto); line-height: 1.45;
    padding-bottom: calc(104px + env(safe-area-inset-bottom));
  }
  body.travado { overflow: hidden; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; -webkit-tap-highlight-color: transparent; }
  img { display: block; max-width: 100%; }
  .oculto { display: none !important; }
  .so-leitor { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  ::selection { background: var(--ouro); color: #111; }

  /* Foco visível para quem usa teclado */
  :focus-visible { outline: 2px solid var(--ouro-claro); outline-offset: 3px; border-radius: 8px; }

  /* ---------- Capa e perfil ---------- */
  .conteudo { max-width: 920px; margin: 0 auto; min-height: 100vh; position: relative; }
  .capa {
    height: 280px; background-color: #120c08;
    background-image: linear-gradient(to bottom, rgba(12,12,14,.25) 0%, rgba(12,12,14,.55) 55%, var(--fundo) 100%), url("imagens/capa.jpg");
    background-size: cover; background-position: center 60%;
  }
  .perfil { text-align: center; margin-top: -86px; padding: 0 20px 22px; position: relative; }
  .logo {
    width: 104px; height: 104px; border-radius: 50%; padding: 3px; background: var(--grad-ouro);
    display: inline-flex; box-shadow: 0 10px 30px rgba(0,0,0,.6), 0 0 0 6px rgba(12,12,14,.7);
  }
  .logo span {
    flex: 1; border-radius: 50%; background: radial-gradient(circle at 30% 25%, #2b2b31, #111114);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--serifa); font-size: 2.1rem; font-weight: 700; letter-spacing: 1px; color: var(--ouro-claro);
  }
  .perfil h1 { font-family: var(--serifa); font-size: clamp(1.5rem, 6vw, 2.1rem); margin-top: 14px; letter-spacing: 4px; font-weight: 700; }
  .perfil .slogan { font-size: .82rem; color: var(--ouro); text-transform: uppercase; letter-spacing: 3px; margin-top: 6px; }
  .perfil .slogan::before, .perfil .slogan::after { content: ""; display: inline-block; width: 28px; height: 1px; background: var(--ouro-escuro); vertical-align: middle; margin: 0 12px; }

  .barra { display: flex; gap: 10px; padding: 6px 18px 18px; flex-wrap: wrap; }
  .busca {
    flex: 1 1 100%; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-radius: 999px;
    background: var(--superficie); border: 1px solid var(--borda); transition: border-color .2s, box-shadow .2s;
  }
  .busca:focus-within { border-color: var(--ouro); box-shadow: 0 0 0 4px rgba(212,168,83,.15); }
  .busca input { flex: 1; border: 0; padding: 14px 4px; outline: 0; background: transparent; font-size: 1rem; min-width: 0; }
  .busca input::placeholder { color: var(--cinza); }
  .btn-contorno {
    flex: 1 1 150px; padding: 12px 10px; border-radius: 999px; font-size: .85rem; font-weight: 600; letter-spacing: .4px;
    color: var(--ouro-claro); border: 1px solid var(--ouro-escuro); background: rgba(212,168,83,.04); transition: background .2s, border-color .2s, transform .1s;
  }
  .btn-contorno:hover { background: rgba(212,168,83,.14); border-color: var(--ouro); }
  .btn-contorno:active { transform: scale(.98); }

  /* ---------- Abas ---------- */
  .abas {
    position: sticky; top: 0; z-index: 20; display: flex; gap: 28px; overflow-x: auto; padding: 0 20px; height: var(--altura-abas);
    background: rgba(12,12,14,.72); -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4);
    border-bottom: 1px solid var(--borda); scrollbar-width: none;
  }
  .abas::-webkit-scrollbar { display: none; }
  .aba { padding: 0 2px; font-size: .78rem; color: var(--cinza); text-transform: uppercase; white-space: nowrap; border-bottom: 2px solid transparent; font-weight: 600; letter-spacing: 2px; transition: color .2s; }
  .aba:hover { color: var(--texto); }
  .aba.ativa { color: var(--ouro-claro); border-bottom-color: var(--ouro); }

  /* ---------- Produtos ---------- */
  .secao { padding: 0 18px; }
  .secao h2 {
    font-family: var(--serifa); font-size: 1.5rem; font-weight: 700; margin: 34px 0 16px; letter-spacing: .5px;
    display: flex; align-items: center; gap: 14px;
  }
  .secao h2::after { content: ""; flex: 1; height: 1px; background: linear-gradient(to right, var(--ouro-escuro), transparent); }
  .lista { display: grid; gap: 14px; grid-template-columns: 1fr; }
  @media (min-width: 680px) { .lista { grid-template-columns: 1fr 1fr; } }

  .produto {
    position: relative; display: flex; gap: 14px; width: 100%; text-align: left; padding: 14px; border-radius: var(--raio);
    background: linear-gradient(160deg, var(--superficie-2), var(--superficie)); border: 1px solid var(--borda);
    transition: transform .25s cubic-bezier(.2,.8,.2,1), border-color .25s, box-shadow .25s;
  }
  .produto:hover { transform: translateY(-3px); border-color: var(--ouro-escuro); box-shadow: 0 14px 34px rgba(0,0,0,.5), 0 0 0 1px rgba(212,168,83,.12); }
  .produto:active { transform: scale(.985); }
  .produto[data-qtd]:not([data-qtd="0"]) { border-color: var(--ouro); box-shadow: 0 0 0 1px rgba(212,168,83,.35), 0 10px 26px rgba(0,0,0,.45); }

  }
  .produto .nome { font-family: var(--serifa); font-weight: 700; font-size: 1.12rem; line-height: 1.25; }
  .produto .desc { font-size: .78rem; color: var(--cinza); flex: 1; line-height: 1.5; }
  .produto .rodape { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
  .produto .preco { font-weight: 700; font-size: 1.05rem; color: var(--ouro-claro); letter-spacing: .3px; }
  .produto .mais {
    width: 34px; height: 34px; border-radius: 50%; font-size: 1.3rem; line-height: 1; font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--grad-ouro); color: #1a1205; box-shadow: 0 4px 12px rgba(212,168,83,.35); transition: transform .2s;
  }
  .produto:hover .mais { transform: rotate(90deg) scale(1.08); }
  .produto .foto-caixa {
    width: 112px; height: 112px; border-radius: 14px; overflow: hidden; flex-shrink: 0; align-self: center;
    background: linear-gradient(110deg, #202025 30%, #2b2b32 50%, #202025 70%); background-size: 200% 100%; animation: brilho 1.4s infinite linear;
    box-shadow: 0 8px 20px rgba(0,0,0,.45);
  }
  .produto .foto { width: 100%; height: 100%; object-fit: cover; transition: transform .5s cubic-bezier(.2,.8,.2,1); }
  .produto:hover .foto { transform: scale(1.1); }
  .produto.anima { animation: entra .55s cubic-bezier(.2,.8,.2,1) backwards; animation-delay: calc(var(--i, 0) * 60ms); }
  .sem-resultado { padding: 44px 16px; text-align: center; color: var(--cinza); font-family: var(--serifa); font-size: 1.1rem; }

  .rodape-loja { padding: 34px 20px 10px; margin-top: 40px; text-align: center; font-size: .85rem; color: var(--cinza); line-height: 1.9; border-top: 1px solid var(--borda); }
  .rodape-loja strong { font-family: var(--serifa); color: var(--ouro-claro); letter-spacing: 3px; font-size: 1rem; }

  /* ---------- Aviso rápido (toast) ---------- */
  .toast {
    position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom)); z-index: 60;
    transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
    background: rgba(29,29,34,.92); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    color: var(--texto); border: 1px solid var(--ouro-escuro); padding: 11px 20px; border-radius: 999px; font-size: .88rem;
    max-width: calc(100% - 32px); box-shadow: 0 10px 30px rgba(0,0,0,.6); transition: opacity .25s, transform .25s;
  }
  .toast.visivel { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- Barra do pedido (fixa embaixo) ---------- */
  .barra-pedido {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(12,12,14,.96) 55%, rgba(12,12,14,0)); animation: sobe .3s ease-out;
  }
  .barra-pedido button {
    display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 884px; margin: 0 auto;
    padding: 16px 22px; border-radius: 999px; font-weight: 700; letter-spacing: .4px;
    background: var(--grad-ouro); color: #1a1205; box-shadow: 0 12px 34px rgba(212,168,83,.35), inset 0 1px 0 rgba(255,255,255,.4);
    transition: transform .15s, filter .2s;
  }
  .barra-pedido button:hover { filter: brightness(1.07); transform: translateY(-1px); }
  .barra-pedido button:active { transform: scale(.985); }

  /* ---------- Painéis (modal inferior) ---------- */
  .fundo { position: fixed; inset: 0; background: rgba(0,0,0,.66); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); z-index: 100; display: flex; align-items: flex-end; justify-content: center; animation: aparece .25s; }
  .painel {
    background: linear-gradient(170deg, #1e1e24, #131316); border: 1px solid var(--borda-forte); border-bottom: 0;
    width: 100%; max-width: 580px; max-height: 92vh; overflow-y: auto; overscroll-behavior: contain;
    border-radius: 26px 26px 0 0; padding: 24px 22px calc(24px + env(safe-area-inset-bottom)); animation: sobe .3s cubic-bezier(.2,.8,.2,1);
    box-shadow: 0 -20px 60px rgba(0,0,0,.6);

  @media (min-width: 680px) { .fundo { align-items: center; } .painel { border-radius: 26px; border-bottom: 1px solid var(--borda-forte); } }
  .painel h3 { font-family: var(--serifa); margin-bottom: 14px; font-size: 1.5rem; }
  .painel .fechar { float: right; width: 38px; height: 38px; font-size: 1.7rem; line-height: 1; color: var(--cinza); border-radius: 50%; transition: background .2s, color .2s; }
  .painel .fechar:hover { background: var(--superficie-2); color: var(--texto); }
  .linha { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--borda); }
  .linha.sem-borda { border: 0; padding: 4px 0; color: var(--cinza); }
  .qtd { display: inline-flex; align-items: center; gap: 12px; margin-top: 8px; }
  .qtd button { width: 32px; height: 32px; border-radius: 50%; background: var(--superficie-2); border: 1px solid var(--borda-forte); font-weight: 700; transition: border-color .2s, color .2s; }
  .qtd button:hover { border-color: var(--ouro); color: var(--ouro-claro); }
  .total { font-family: var(--serifa); font-size: 1.4rem; font-weight: 700; color: var(--ouro-claro) !important; padding-top: 10px !important; }
  .campo { display: block; font-weight: 600; font-size: .8rem; margin-top: 14px; color: var(--cinza); letter-spacing: 1px; text-transform: uppercase; }
  .campo input, .campo select {
    width: 100%; padding: 14px; margin-top: 6px; border: 1px solid var(--borda-forte); border-radius: 12px; font-size: 1rem;
    background: var(--superficie); color: var(--texto); text-transform: none; letter-spacing: 0; font-weight: 400;
  }
  .campo input:focus, .campo select:focus { border-color: var(--ouro); outline: 0; box-shadow: 0 0 0 4px rgba(212,168,83,.18); }
  .campo input.erro, .campo select.erro { border-color: var(--erro); background: rgba(255,122,122,.08); }
  .btn-principal {
    width: 100%; padding: 16px; margin-top: 20px; border-radius: 999px; font-weight: 700; letter-spacing: .5px;
    background: var(--grad-ouro); color: #1a1205; box-shadow: 0 10px 28px rgba(212,168,83,.3); transition: filter .2s, transform .15s;
  }
  .btn-principal:hover { filter: brightness(1.07); }
  .btn-principal:active { transform: scale(.985); }
  .btn-whats { background: linear-gradient(135deg, #4be08a, #1faa59); color: #04210f; box-shadow: 0 10px 28px rgba(31,170,89,.3); }
  .msg-erro { color: var(--erro); font-weight: 600; min-height: 1.3em; margin-top: 12px; font-size: .88rem; }
  .info p { margin: 10px 0; font-size: .95rem; color: var(--cinza); }
  .info strong { color: var(--texto); }
  .dica { font-size: .75rem; color: var(--cinza); margin-top: 12px; text-align: center; }

  @keyframes sobe { from { transform: translateY(28px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes aparece { from { opacity: 0; } to { opacity: 1; } }
  @keyframes entra { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  @keyframes brilho { to { background-position: -200% 0; } }

  /* Respeita quem prefere menos movimento */
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<div class="conteudo">

<script>
/* ============================================================
   1) DADOS DA LOJA  ← EDITE AQUI
   ============================================================ */
// >>> ALTERE AQUI O NÚMERO DO WHATSAPP (55 + DDD + número, só dígitos) <<<
const WHATSAPP_NUMERO = "5500000000000";

const LOJA = {
  nome: "BURGER MODELO",
  sigla: "BM",              // letras do logo redondo (2 a 3 letras)
  slogan: "Artesanal de verdade",
  telefone: "(00) 00000-0000",
  endereco: "Rua Exemplo, 123 – Centro",
  taxaEntrega: 5.00,
  tempoEntrega: "40 a 60 minutos"
};

/* ============================================================
   2) CARDÁPIO  ← EDITE AQUI (nomes, descrições, preços e fotos)
   "foto" é o nome do arquivo em imagens/ (sem o .jpg). Pode deixar vazio.
   "selo" é opcional: uma etiqueta dourada no produto (ex.: "Mais pedido").
   ============================================================ */
const CARDAPIO = [
  { categoria: "Hambúrguer Artesanal", itens: [
    { nome: "Hambúrguer da Casa",  desc: "Pão brioche, blend 140g, cheddar, molho, alface", preco: 12.00, foto: "hamburguer-casa" },
    { nome: "Hambúrguer Duplo",    desc: "Pão brioche, 2 blends 140g, 2 cheddar, molho, alface", preco: 19.00, foto: "hamburguer-duplo", selo: "Mais pedido" },
    { nome: "Hambúrguer Triplo",   desc: "Pão brioche, 3 blends 140g, 3 cheddar, molho, alface", preco: 25.00, foto: "hamburguer-triplo" },
    { nome: "Trio Artesanal",      desc: "Hambúrguer da casa, refrigerante lata e porção pequena de batata", preco: 21.00, foto: "capa", selo: "Combo" },
    { nome: "Dog no Molho",        desc: "Pão de leite, salsicha, milho, batata palha, queijo e molho", preco: 11.00, foto: "dog" },
    { nome: "Combo Família",       desc: "5 hambúrgueres, 1 batata grande com cheddar e bacon, 1 refrigerante 1,5L", preco: 85.00, foto: "combo-familia", selo: "Para dividir" }
  ]},
  { categoria: "Bebidas", itens: [
    { nome: "Refrigerante Lata 310ml", desc: "Cola, guaraná ou laranja", preco: 6.00, foto: "refri-lata" },
    { nome: "Refrigerante 2L",         desc: "Cola ou guaraná", preco: 14.00, foto: "refri-2l" },
    { nome: "Suco de Uva Lata",        desc: "", preco: 8.00, foto: "suco-uva" },
    { nome: "Água sem Gás 500ml",      desc: "", preco: 3.50, foto: "agua-sem-gas" },
    { nome: "Água com Gás 500ml",      desc: "", preco: 3.00, foto: "agua-com-gas" }
  ]},
  { categoria: "Batata Frita", itens: [
    { nome: "Porção de Batata Frita",       desc: "Porção 400g", preco: 19.00, foto: "batata" },
    { nome: "Batata Frita Cheddar e Bacon", desc: "Porção 400g", preco: 25.00, foto: "batata-cheddar" },
    { nome: "Batata Frita Pequena",         desc: "Saquinho", preco: 6.00, foto: "batata-pequena" }
  ]}
];

/* ============================================================
   3) ESTADO E UTILITÁRIOS
   ============================================================ */
let carrinho = {};   // { "nome do item": { nome, preco, qtd } }
let primeiraVez = true;
let ultimoFoco = null;
let temporizadorToast;
const CHAVE_CLIENTE = "burger-modelo-cliente";
const $ = (id) => document.getElementById(id);
const moeda = (v) => v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const itensCarrinho = () => Object.values(carrinho);
const subtotal = () => itensCarrinho().reduce((t, i) => t + i.preco * i.qtd, 0);
const totalQtd = () => itensCarrinho().reduce((t, i) => t + i.qtd, 0);
const slug = (s) => "cat-" + s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-");

// Guardar os dados do cliente só neste aparelho (nunca é enviado a lugar nenhum)
const lerCliente = () => { try { return JSON.parse(localStorage.getItem(CHAVE_CLIENTE)) || {}; } catch (e) { return {}; } };
const salvarCliente = (d) => { try { localStorage.setItem(CHAVE_CLIENTE, JSON.stringify(d)); } catch (e) { /* sem armazenamento: tudo bem */ } };

/* ============================================================
   4) CARDÁPIO NA TELA
   ============================================================ */
function montarLoja() {
  document.title = LOJA.nome + " – Cardápio Online";
  $("nome-loja").textContent = LOJA.nome;
  $("sigla").textContent = LOJA.sigla;
  $("slogan").textContent = LOJA.slogan;
  $("rodape-loja").innerHTML =
    `<strong>${esc(LOJA.nome)}</strong><br>Telefone: ${esc(LOJA.telefone)}<br>Endereço: ${esc(LOJA.endereco)}`;

  $("abas").innerHTML = CARDAPIO.map((c, i) =>
    `<button type="button" class="aba ${i === 0 ? "ativa" : ""}" data-alvo="${slug(c.categoria)}">${esc(c.categoria)}</button>`).join("");
  document.querySelectorAll(".aba").forEach((b) => b.addEventListener("click", () => {
    const alvo = $(b.dataset.alvo);
    if (alvo) alvo.scrollIntoView({ behavior: "smooth" });
  }));
  desenharProdutos("");
}

function desenharProdutos(filtro) {
  const termo = filtro.trim().toLowerCase();
  const html = CARDAPIO.map((cat) => {
    const itens = cat.itens.filter((i) => !termo || (i.nome + " " + i.desc).toLowerCase().includes(termo));
    if (!itens.length) return "";
    return `<section class="secao" id="${slug(cat.categoria)}" aria-label="${esc(cat.categoria)}">
      <h2>${esc(cat.categoria.toUpperCase())}</h2>
      <div class="lista">${itens.map((i, n) =>
        `<button type="button" class="produto${primeiraVez ? " anima" : ""}" style="--i:${n}" data-nome="${esc(i.nome)}" aria-label="Adicionar ${esc(i.nome)}, ${moeda(i.preco)}">
           <span class="texto">
             ${i.selo ? `<span class="selo">${esc(i.selo)}</span>` : ""}
             <span class="nome">${esc(i.nome)}</span>
             <span class="desc">${esc(i.desc)}</span>
             <span class="rodape"><span class="preco">${moeda(i.preco)}</span><span class="mais" aria-hidden="true">+</span></span>
           </span>
           ${i.foto ? `<span class="foto-caixa"><img class="foto" src="imagens/${esc(i.foto)}.jpg" alt="" loading="lazy" decoding="async" width="96" height="96"></span>` : ""}
         </button>`).join("")}</div>
    </section>`;
  }).join("");
  $("secoes").innerHTML = html || '<p class="sem-resultado">Nenhum produto encontrado para essa busca.</p>';
  document.querySelectorAll(".produto").forEach((b) => b.addEventListener("click", () => adicionar(b.dataset.nome)));
  // Se uma foto falhar, esconde só ela (o card continua bonito)
  document.querySelectorAll(".produto .foto").forEach((img) =>
    img.addEventListener("error", () => img.closest(".foto-caixa").remove()));
  primeiraVez = false;   // a animação de entrada roda só na primeira vez
  atualizarContadores();
}

function adicionar(nome) {
  const item = CARDAPIO.flatMap((c) => c.itens).find((i) => i.nome === nome);
  if (!item) return;
  if (carrinho[nome]) carrinho[nome].qtd += 1;
  else carrinho[nome] = { nome, preco: item.preco, qtd: 1 };
  atualizarBarra();
  avisar(`✓ ${nome} adicionado`);
}

// Mostra "2x" no cartão dos produtos que já estão no pedido
function atualizarContadores() {
  document.querySelectorAll(".produto").forEach((b) => {
    const q = carrinho[b.dataset.nome] ? carrinho[b.dataset.nome].qtd : 0;
    b.dataset.qtd = q;
  });
}

function atualizarBarra() {
  const q = totalQtd();
  $("barra-pedido").classList.toggle("oculto", q === 0);
  $("barra-qtd").textContent = q + (q === 1 ? " item" : " itens");
  $("barra-total").textContent = moeda(subtotal());
  atualizarContadores();
}

function avisar(texto) {
  const t = $("toast");
  t.textContent = texto;
  t.classList.add("visivel");
  clearTimeout(temporizadorToast);
  temporizadorToast = setTimeout(() => t.classList.remove("visivel"), 1600);
}

// Destaca a aba da categoria visível e a mantém à vista
let ticking = false;
window.addEventListener("scroll", () => {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => {
    let atual = CARDAPIO[0] && slug(CARDAPIO[0].categoria);
    CARDAPIO.forEach((c) => {
      const el = $(slug(c.categoria));
      if (el && el.getBoundingClientRect().top < 120) atual = slug(c.categoria);
    });
    document.querySelectorAll(".aba").forEach((b) => {
      const ativa = b.dataset.alvo === atual;
      if (ativa && !b.classList.contains("ativa")) b.scrollIntoView({ inline: "center", block: "nearest" });
      b.classList.toggle("ativa", ativa);
    });
    ticking = false;
  });
}, { passive: true });

/* ============================================================
   5) PAINÉIS: pedido, checkout, taxa, meus pedidos
   ============================================================ */
function abrirPainel(html) {
  if ($("fundo").classList.contains("oculto")) ultimoFoco = document.activeElement;
  $("painel-conteudo").innerHTML = html;
  $("fundo").classList.remove("oculto");
  document.body.classList.add("travado");
  $("btn-fechar").focus();
}
function fecharPainel() {
  if ($("fundo").classList.contains("oculto")) return;
  $("fundo").classList.add("oculto");
  document.body.classList.remove("travado");
  if (ultimoFoco && document.contains(ultimoFoco)) ultimoFoco.focus();
}

function painelPedido() {
  if (!itensCarrinho().length) { fecharPainel(); return; }
  const linhas = itensCarrinho().map((i) =>
    `<div class="linha"><div><strong>${esc(i.nome)}</strong><br>
       <span class="qtd"><button type="button" data-acao="-" data-nome="${esc(i.nome)}" aria-label="Diminuir ${esc(i.nome)}">−</button><span aria-live="polite">${i.qtd}</span><button type="button" data-acao="+" data-nome="${esc(i.nome)}" aria-label="Aumentar ${esc(i.nome)}">+</button></span></div>
     <strong>${moeda(i.preco * i.qtd)}</strong></div>`).join("");
  abrirPainel(`<h3 id="painel-titulo">Seu pedido</h3>${linhas}
    <div class="linha sem-borda"><span>Subtotal</span><span>${moeda(subtotal())}</span></div>
    <div class="linha sem-borda"><span>Taxa de entrega</span><span>${moeda(LOJA.taxaEntrega)}</span></div>
    <div class="linha sem-borda total"><span>Total</span><span>${moeda(subtotal() + LOJA.taxaEntrega)}</span></div>
    <button type="button" class="btn-principal" id="btn-continuar">Continuar</button>`);
  document.querySelectorAll("[data-acao]").forEach((b) => b.addEventListener("click", () => {
    const it = carrinho[b.dataset.nome];
    if (!it) return;
    it.qtd += b.dataset.acao === "+" ? 1 : -1;
    if (it.qtd <= 0) delete carrinho[b.dataset.nome];
    atualizarBarra();
    painelPedido();
  }));
  $("btn-continuar").addEventListener("click", painelCheckout);
}

function painelCheckout() {
  const c = lerCliente();
  abrirPainel(`<h3 id="painel-titulo">Entrega e pagamento</h3>
    <form id="form" novalidate>
      <label class="campo">Seu nome *<input id="f-nome" type="text" autocomplete="name" value="${esc(c.nome || "")}"></label>
      <label class="campo">Rua e número *<input id="f-rua" type="text" autocomplete="street-address" value="${esc(c.rua || "")}"></label>
      <label class="campo">Bairro *<input id="f-bairro" type="text" value="${esc(c.bairro || "")}"></label>
      <label class="campo">Complemento / referência *<input id="f-comp" type="text" value="${esc(c.comp || "")}"></label>
      <label class="campo">Forma de pagamento *
        <select id="f-pag"><option value="">Selecione</option><option>Cartão de Crédito</option><option>Cartão de Débito</option><option>Pix</option><option>Dinheiro</option></select>
      </label>
      <label class="campo oculto" id="bloco-troco">Troco para quanto? *<input id="f-troco" type="text" inputmode="decimal" placeholder="Ex.: 50 (ou 0 se não precisa)"></label>
      <p class="msg-erro" id="msg-erro" role="alert"></p>
      <button type="submit" class="btn-principal btn-whats">Enviar pedido por WhatsApp</button>
      <p class="dica">Seus dados de entrega ficam salvos só neste aparelho, para o próximo pedido.</p>
    </form>`);
  $("f-pag").addEventListener("change", (e) => {
    $("bloco-troco").classList.toggle("oculto", e.target.value !== "Dinheiro");
  });
  $("form").addEventListener("submit", enviar);
}

function enviar(e) {
  e.preventDefault();
  const campos = [["f-nome", "Nome"], ["f-rua", "Rua e número"], ["f-bairro", "Bairro"], ["f-comp", "Complemento / referência"], ["f-pag", "Forma de pagamento"]];
  if ($("f-pag").value === "Dinheiro") campos.push(["f-troco", "Troco"]);
  let erro = "", primeiro = null;
  ["f-nome", "f-rua", "f-bairro", "f-comp", "f-pag", "f-troco"].forEach((id) => $(id).classList.remove("erro"));
  campos.forEach(([id, rotulo]) => {
    const vazio = $(id).value.trim() === "";
    $(id).classList.toggle("erro", vazio);
    if (vazio && !erro) { erro = `Preencha: ${rotulo}.`; primeiro = $(id); }
  });
  $("msg-erro").textContent = erro;
  if (erro) { primeiro.focus(); return; }
  if (!itensCarrinho().length) { $("msg-erro").textContent = "Seu pedido está vazio."; return; }

  const v = (id) => $(id).value.trim();
  salvarCliente({ nome: v("f-nome"), rua: v("f-rua"), bairro: v("f-bairro"), comp: v("f-comp") });
  const itens = itensCarrinho().map((i) => `• ${i.qtd}x ${i.nome} - ${moeda(i.preco * i.qtd)}`).join("\n");
  let msg = `*NOVO PEDIDO - ${LOJA.nome}*\n\nCliente: ${v("f-nome")}\n\n*Itens:*\n${itens}\n\n` +
    `Subtotal: ${moeda(subtotal())}\nTaxa de entrega: ${moeda(LOJA.taxaEntrega)}\n*Total: ${moeda(subtotal() + LOJA.taxaEntrega)}*\n\n` +
    `*Endereço:*\n${v("f-rua")}\nBairro: ${v("f-bairro")}\nComplemento: ${v("f-comp")}\n\n*Pagamento:* ${v("f-pag")}`;
  if (v("f-pag") === "Dinheiro") msg += `\nTroco para: ${v("f-troco")}`;
  window.open(`https://wa.me/${WHATSAPP_NUMERO}?text=${encodeURIComponent(msg)}`, "_blank", "noopener");
}

function painelTaxa() {
  abrirPainel(`<h3 id="painel-titulo">Taxa e tempo de entrega</h3><div class="info">
    <p><strong>Taxa fixa:</strong> ${moeda(LOJA.taxaEntrega)}</p>
    <p><strong>Tempo estimado:</strong> ${esc(LOJA.tempoEntrega)}</p>
    <p><strong>Endereço da loja:</strong> ${esc(LOJA.endereco)}</p></div>`);
}

function painelMeusPedidos() {
  abrirPainel(`<h3 id="painel-titulo">Meus pedidos</h3><div class="info"><p>Seus pedidos são enviados por WhatsApp.
    Para acompanhar um pedido, fale com a loja pelo telefone ${esc(LOJA.telefone)}.</p></div>`);
}

/* ============================================================
   6) EVENTOS E INICIALIZAÇÃO
   ============================================================ */
$("busca").addEventListener("input", (e) => desenharProdutos(e.target.value));
$("btn-ver-pedido").addEventListener("click", painelPedido);
$("btn-taxa").addEventListener("click", painelTaxa);
$("btn-pedidos").addEventListener("click", painelMeusPedidos);
$("btn-fechar").addEventListener("click", fecharPainel);
$("fundo").addEventListener("click", (e) => { if (e.target === $("fundo")) fecharPainel(); });

document.addEventListener("keydown", (e) => {
  if ($("fundo").classList.contains("oculto")) return;
  if (e.key === "Escape") { fecharPainel(); return; }
  // Mantém o Tab dentro do painel aberto
  if (e.key === "Tab") {
    const foco = [...$("fundo").querySelectorAll("button, input, select")].filter((el) => el.offsetParent !== null);
    if (!foco.length) return;
    const primeiro = foco[0], ultimo = foco[foco.length - 1];
    if (e.shiftKey && document.activeElement === primeiro) { e.preventDefault(); ultimo.focus(); }
    else if (!e.shiftKey && document.activeElement === ultimo) { e.preventDefault(); primeiro.focus(); }
  }
});

montarLoja();
</script>
