<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Burger Modelo – Cardápio Online</title>
<meta name="description" content="Cardápio online do Burger Modelo: hambúrgueres artesanais, bebidas e batatas fritas. Monte seu pedido e envie pelo WhatsApp.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0c0c0e">
<meta property="og:title" content="Burger Modelo – Cardápio Online">
<meta property="og:description" content="Hambúrgueres artesanais com entrega. Peça pelo WhatsApp.">
<meta property="og:type" content="website">
<meta property="og:image" content="imagens/capa.jpg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍔%3C/text%3E%3C/svg%3E">

<!-- ============================================================
     ESTILOS
     Organização: 1 variáveis · 2 base · 3 topo · 4 abas · 5 produtos
                  6 barras e avisos · 7 painéis · 8 ajustes (telas, acessibilidade, impressão)
     ============================================================ -->
<style>
  /* ---------- 1) Variáveis (troque as cores aqui) ---------- */
  :root {
    color-scheme: dark;
    --fundo: #0c0c0e;
    --superficie: #151518;
    --superficie-2: #1d1d22;
    --borda: rgba(255, 255, 255, .09);
    --borda-forte: rgba(255, 255, 255, .2);
    --texto: #f5efe4;
    --cinza: #a8a296;                 /* contraste AA sobre o fundo escuro */
    --ouro: #d4a853;
    --ouro-claro: #f2d28f;
    --ouro-escuro: #a97f2f;
    --grad-ouro: linear-gradient(135deg, #f2d28f 0%, #d4a853 50%, #b8872f 100%);
    --tinta-ouro: #1a1205;            /* texto sobre botões dourados */
    --verde: #4be08a;
    --vermelho: #ff7a7a;
    --raio: 18px;
    --altura-abas: 56px;
    --margem: max(18px, env(safe-area-inset-left), env(safe-area-inset-right));
    --serifa: "Playfair Display", Georgia, "Times New Roman", serif;
    --curva: cubic-bezier(.2, .8, .2, 1);
  }

  /* ---------- 2) Base ---------- */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html {
    scroll-behavior: smooth; scroll-padding-top: calc(var(--altura-abas) + 8px);
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: var(--fundo);
    scrollbar-width: thin; scrollbar-color: var(--ouro-escuro) var(--fundo);
  }
  body {
    position: relative; min-height: 100vh; min-height: 100dvh;
    font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif; color: var(--texto); line-height: 1.45;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    padding-bottom: calc(104px + env(safe-area-inset-bottom));
  }
  /* brilho de fundo fixo (em pseudo-elemento: rola suave também no iPhone) */
  body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(1200px 600px at 50% -10%, #2a2013 0%, transparent 60%), var(--fundo); }
  body.travado { overflow: hidden; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  ul { list-style: none; }
  img { display: block; max-width: 100%; }
  h1, h2, h3 { text-wrap: balance; }
  ::selection { background: var(--ouro); color: #111; }
  .oculto { display: none !important; }
  .so-leitor { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  :focus-visible { outline: 2px solid var(--ouro-claro); outline-offset: 3px; border-radius: 8px; }
  main:focus { outline: none; }

  /* link "pular para o cardápio" (só aparece com o teclado) */
  .pular {
    position: fixed; top: 8px; left: 8px; z-index: 300; padding: 10px 16px; border-radius: 999px;
    background: var(--grad-ouro); color: var(--tinta-ouro); font-weight: 700; text-decoration: none;
    transform: translateY(-160%); transition: transform .2s;
  }
  .pular:focus { transform: none; }

  /* ---------- 3) Topo: capa, perfil, busca ---------- */
  .conteudo { max-width: 960px; margin: 0 auto; }
  .capa { position: relative; height: 280px; overflow: hidden; background: #120c08; }
  .capa img { width: 100%; height: 100%; object-fit: cover; object-position: center 60%; }
  .capa::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(12,12,14,.25) 0%, rgba(12,12,14,.55) 55%, var(--fundo) 100%); }
  .perfil { position: relative; margin-top: -86px; padding: 0 var(--margem) 22px; text-align: center; }
  .logo {
    display: inline-flex; width: 104px; height: 104px; padding: 3px; border-radius: 50%; background: var(--grad-ouro);
    box-shadow: 0 10px 30px rgba(0,0,0,.6), 0 0 0 6px rgba(12,12,14,.7);
  }
  .logo span {
    flex: 1; display: flex; align-items: center; justify-content: center; border-radius: 50%;
    background: radial-gradient(circle at 30% 25%, #2b2b31, #111114);
    font-family: var(--serifa); font-size: 2.1rem; font-weight: 700; letter-spacing: 1px; color: var(--ouro-claro);
  }
  .perfil h1 { margin-top: 14px; font-family: var(--serifa); font-size: clamp(1.5rem, 6vw, 2.2rem); font-weight: 700; letter-spacing: 4px; }
  .slogan { margin-top: 6px; font-size: .8rem; color: var(--ouro); text-transform: uppercase; letter-spacing: 3px; }
  .slogan::before, .slogan::after { content: ""; display: inline-block; width: 28px; height: 1px; margin: 0 12px; vertical-align: middle; background: var(--ouro-escuro); }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 16px; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px; padding: 6px 13px; border-radius: 999px;
    font-size: .78rem; color: var(--cinza); background: rgba(255,255,255,.04); border: 1px solid var(--borda);
  }
  .chip .ponto { width: 8px; height: 8px; border-radius: 50%; background: var(--vermelho); }
  .chip.aberto { color: var(--texto); }
  .chip.aberto .ponto { background: var(--verde); box-shadow: 0 0 0 0 rgba(75,224,138,.6); animation: pulsa 2s infinite; }

  .barra { display: flex; flex-wrap: wrap; gap: 10px; padding: 6px var(--margem) 18px; }
  .busca {
    flex: 1 1 100%; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-radius: 999px;
    background: var(--superficie); border: 1px solid var(--borda); color: var(--cinza); transition: border-color .2s, box-shadow .2s, color .2s;
  }
  .busca svg { flex-shrink: 0; width: 18px; height: 18px; }
  .busca:focus-within { border-color: var(--ouro); box-shadow: 0 0 0 4px rgba(212,168,83,.15); color: var(--ouro-claro); }
  .busca input { flex: 1; min-width: 0; padding: 14px 0; border: 0; outline: 0; background: transparent; color: var(--texto); font-size: 1rem; }
  .busca input::placeholder { color: var(--cinza); }
  .busca input::-webkit-search-cancel-button { filter: invert(.8) sepia(.5); cursor: pointer; }
  .btn-contorno {
    flex: 1 1 150px; padding: 12px 10px; border-radius: 999px; font-size: .85rem; font-weight: 600; letter-spacing: .4px;
    color: var(--ouro-claro); background: rgba(212,168,83,.04); border: 1px solid var(--ouro-escuro); transition: background .2s, border-color .2s, transform .1s;
  }
  .btn-contorno:active { transform: scale(.98); }

  /* ---------- 4) Abas ---------- */
  .abas {
    position: sticky; top: 0; z-index: 20; display: flex; gap: 28px; height: var(--altura-abas); padding: 0 var(--margem);
    overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--borda);
    background: rgba(12,12,14,.9); -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4);
  }
  .abas::-webkit-scrollbar { display: none; }
  .aba { flex-shrink: 0; padding: 0 2px; font-size: .78rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; white-space: nowrap; color: var(--cinza); transition: color .2s; }
  .aba.ativa { color: var(--ouro-claro); }
  /* sublinhado dourado único que desliza de uma aba para outra */
  .aba-barra { position: absolute; left: 0; bottom: 0; height: 2px; width: 0; border-radius: 2px; background: var(--grad-ouro); transition: transform .35s var(--curva), width .35s var(--curva), opacity .2s; pointer-events: none; }

  /* ---------- 5) Produtos ---------- */
  .secao { padding: 0 var(--margem); }
  .secao h2 { display: flex; align-items: center; gap: 14px; margin: 34px 0 16px; font-family: var(--serifa); font-size: 1.5rem; font-weight: 700; letter-spacing: .5px; }
  .secao h2::after { content: ""; flex: 1; height: 1px; background: linear-gradient(to right, var(--ouro-escuro), transparent); }
  .lista { display: grid; gap: 14px; grid-template-columns: 1fr; }
  @media (min-width: 680px) { .lista { grid-template-columns: 1fr 1fr; } }

  .produto {
    position: relative; display: flex; gap: 14px; width: 100%; height: 100%; padding: 14px; border-radius: var(--raio); text-align: left;
    background: linear-gradient(160deg, var(--superficie-2), var(--superficie)); border: 1px solid var(--borda);
    transition: transform .25s var(--curva), border-color .25s, box-shadow .25s;
  }
  .produto:active { transform: scale(.985); }
  .produto[data-qtd]:not([data-qtd="0"]) { border-color: var(--ouro); box-shadow: 0 0 0 1px rgba(212,168,83,.35), 0 10px 26px rgba(0,0,0,.45); }
  .produto[data-qtd]:not([data-qtd="0"])::after {
    content: attr(data-qtd) "x"; position: absolute; top: -9px; right: 14px; padding: 3px 10px; border-radius: 999px;
    background: var(--grad-ouro); color: var(--tinta-ouro); font-size: .72rem; font-weight: 800; box-shadow: 0 4px 10px rgba(0,0,0,.4);
  }
  .produto .texto { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .produto .selo { align-self: flex-start; padding: 3px 9px; border-radius: 999px; background: var(--grad-ouro); color: var(--tinta-ouro); font-size: .64rem; font-weight: 800; letter-spacing: 1.6px; text-transform: uppercase; }
  .produto .nome { font-family: var(--serifa); font-size: 1.12rem; font-weight: 700; line-height: 1.25; }
  .produto .desc { flex: 1; font-size: .8rem; line-height: 1.5; color: var(--cinza); display: -webkit-box; -webkit-line-clamp: 3; line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .produto .rodape { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
  .produto .preco { font-size: 1.05rem; font-weight: 700; letter-spacing: .3px; color: var(--ouro-claro); font-variant-numeric: tabular-nums; }
  .produto .mais {
    display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 50%;
    background: var(--grad-ouro); color: var(--tinta-ouro); font-size: 1.3rem; font-weight: 600; line-height: 1; box-shadow: 0 4px 12px rgba(212,168,83,.35); transition: transform .2s;
  }
  .produto .foto-caixa {
    flex-shrink: 0; align-self: center; width: 112px; aspect-ratio: 1; border-radius: 14px; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,.45);
    background: linear-gradient(110deg, #202025 30%, #2b2b32 50%, #202025 70%); background-size: 200% 100%; animation: brilho 1.4s infinite linear;
  }
  .produto .foto { width: 100%; height: 100%; object-fit: cover; transition: transform .5s var(--curva); }
  .produto.anima { animation: entra .55s var(--curva) backwards; animation-delay: calc(var(--i, 0) * 60ms); }
  .sem-resultado { padding: 44px 16px; text-align: center; font-family: var(--serifa); font-size: 1.1rem; color: var(--cinza); }
  .rodape-loja { margin-top: 40px; padding: 34px var(--margem) 10px; border-top: 1px solid var(--borda); text-align: center; font-size: .85rem; line-height: 1.9; color: var(--cinza); }
  .rodape-loja strong { font-family: var(--serifa); font-size: 1rem; letter-spacing: 3px; color: var(--ouro-claro); }

  /* efeitos de passar o mouse: só em aparelhos que têm mouse (evita "hover preso" no toque) */
  @media (hover: hover) {
    .btn-contorno:hover { background: rgba(212,168,83,.14); border-color: var(--ouro); }
    .aba:hover { color: var(--texto); }
    .produto:hover { transform: translateY(-3px); border-color: var(--ouro-escuro); box-shadow: 0 14px 34px rgba(0,0,0,.5), 0 0 0 1px rgba(212,168,83,.12); }
    .produto:hover .mais { transform: rotate(90deg) scale(1.08); }
    .produto:hover .foto { transform: scale(1.1); }
  }

  /* ---------- 6) Barras e avisos ---------- */
  .toast {
    position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom)); z-index: 60; max-width: calc(100% - 32px);
    padding: 11px 20px; border-radius: 999px; border: 1px solid var(--ouro-escuro); font-size: .88rem; pointer-events: none;
    background: rgba(29,29,34,.94); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); box-shadow: 0 10px 30px rgba(0,0,0,.6);
    opacity: 0; transform: translate(-50%, 20px); transition: opacity .25s, transform .25s;
  }
  .toast.visivel { opacity: 1; transform: translate(-50%, 0); }
  .barra-pedido {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; padding: 12px var(--margem) calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(12,12,14,.96) 55%, rgba(12,12,14,0)); animation: sobe .3s ease-out;
  }
  .barra-pedido button {
    display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 924px; margin: 0 auto; padding: 16px 22px; border-radius: 999px;
    background: var(--grad-ouro); color: var(--tinta-ouro); font-weight: 700; letter-spacing: .4px; font-variant-numeric: tabular-nums;
    box-shadow: 0 12px 34px rgba(212,168,83,.35), inset 0 1px 0 rgba(255,255,255,.4); transition: transform .15s, filter .2s;
  }
  .barra-pedido button:active { transform: scale(.985); }
  .barra-pedido button.bump { animation: bump .35s var(--curva); }
  @media (hover: hover) { .barra-pedido button:hover { filter: brightness(1.07); transform: translateY(-1px); } }

  /* ---------- 7) Painéis (carrinho, checkout, informações) ---------- */
  .fundo {
    position: fixed; inset: 0; z-index: 100; display: flex; align-items: flex-end; justify-content: center;
    background: rgba(0,0,0,.7); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); animation: aparece .25s;
  }
  .painel {
    width: 100%; max-width: 580px; max-height: 92vh; max-height: 92dvh; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--ouro-escuro) transparent;
    padding: 26px 22px calc(24px + env(safe-area-inset-bottom)); border-radius: 26px 26px 0 0; border: 1px solid var(--borda-forte); border-bottom: 0;
    background: linear-gradient(170deg, #1e1e24, #131316); box-shadow: 0 -20px 60px rgba(0,0,0,.6); animation: sobe .3s var(--curva);
  }
  .painel::before { content: ""; display: block; width: 44px; height: 4px; margin: -14px auto 14px; border-radius: 4px; background: var(--borda-forte); }   /* "puxador" no celular */
  @media (min-width: 680px) { .fundo { align-items: center; } .painel { border-radius: 26px; border-bottom: 1px solid var(--borda-forte); } .painel::before { display: none; } }
  .painel h3 { margin-bottom: 14px; font-family: var(--serifa); font-size: 1.5rem; }
  .painel .fechar { float: right; width: 38px; height: 38px; margin: -4px -6px 0 0; border-radius: 50%; font-size: 1.7rem; line-height: 1; color: var(--cinza); transition: background .2s, color .2s; }
  .painel .fechar:hover { background: var(--superficie-2); color: var(--texto); }
  .linha { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--borda); font-variant-numeric: tabular-nums; }
  .linha.sem-borda { padding: 4px 0; border: 0; color: var(--cinza); }
  .linha.total { padding-top: 10px; font-family: var(--serifa); font-size: 1.4rem; font-weight: 700; color: var(--ouro-claro); }
  .qtd { display: inline-flex; align-items: center; gap: 12px; margin-top: 8px; }
  .qtd button { width: 34px; height: 34px; border-radius: 50%; background: var(--superficie-2); border: 1px solid var(--borda-forte); font-weight: 700; transition: border-color .2s, color .2s; }
  .qtd button:hover { border-color: var(--ouro); color: var(--ouro-claro); }
  .campo { display: block; margin-top: 14px; font-size: .78rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--cinza); }
  .campo input, .campo select {
    width: 100%; margin-top: 6px; padding: 14px; border-radius: 12px; border: 1px solid var(--borda-forte); background: var(--superficie);
    color: var(--texto); font-size: 1rem; font-weight: 400; letter-spacing: 0; text-transform: none; transition: border-color .2s, box-shadow .2s;
  }
  .campo input:focus, .campo select:focus { border-color: var(--ouro); outline: 0; box-shadow: 0 0 0 4px rgba(212,168,83,.18); }
  .campo [aria-invalid="true"] { border-color: var(--vermelho); background: rgba(255,122,122,.08); }
  .btn-principal {
    width: 100%; margin-top: 20px; padding: 16px; border-radius: 999px; background: var(--grad-ouro); color: var(--tinta-ouro);
    font-weight: 700; letter-spacing: .5px; box-shadow: 0 10px 28px rgba(212,168,83,.3); transition: filter .2s, transform .15s;
  }
  .btn-principal:hover { filter: brightness(1.07); }
  .btn-principal:active { transform: scale(.985); }
  .btn-whats { background: linear-gradient(135deg, var(--verde), #1faa59); color: #04210f; box-shadow: 0 10px 28px rgba(31,170,89,.3); }
  .msg-erro { min-height: 1.3em; margin-top: 12px; font-size: .88rem; font-weight: 600; color: var(--vermelho); }
  .info p { margin: 10px 0; font-size: .95rem; color: var(--cinza); }
  .info strong { color: var(--texto); }
  .dica { margin-top: 12px; text-align: center; font-size: .75rem; color: var(--cinza); }

  /* ---------- Animações ---------- */
  @keyframes sobe { from { transform: translateY(28px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes aparece { from { opacity: 0; } to { opacity: 1; } }
  @keyframes entra { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  @keyframes brilho { to { background-position: -200% 0; } }
  @keyframes pulsa { 70% { box-shadow: 0 0 0 7px rgba(75,224,138,0); } 100% { box-shadow: 0 0 0 0 rgba(75,224,138,0); } }
  @keyframes bump { 40% { transform: scale(1.03); } }

  /* ---------- 8) Ajustes: telas, acessibilidade, impressão ---------- */
  @media (max-width: 359px) {                       /* celulares bem estreitos */
    .produto { padding: 12px; gap: 10px; }
    .produto .foto-caixa { width: 84px; }
    .abas { gap: 20px; }
  }
  @media (min-width: 900px) { .capa { height: 340px; } .perfil { margin-top: -96px; } }
  @media (orientation: landscape) and (max-height: 500px) { .capa { height: 160px; } .perfil { margin-top: -60px; } }

  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .abas { background: #0c0c0e; }
    .fundo { background: rgba(0,0,0,.85); }
    .toast { background: #1d1d22; }
  }
  @media (prefers-contrast: more) {
    :root { --borda: rgba(255,255,255,.4); --cinza: #d0cabd; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  @media print {
    body { background: #fff; color: #000; padding: 0; }
    body::before, .capa, .barra, .abas, .toast, .barra-pedido, .fundo, .pular, .produto .foto-caixa, .produto .mais { display: none !important; }
    .produto { break-inside: avoid; border-color: #bbb; background: none; box-shadow: none; }
    .produto .preco, .produto .nome, .secao h2, .perfil h1 { color: #000; }
    .produto .desc, .slogan, .rodape-loja { color: #444; }
  }
</style>
</head>
<body>

<a class="pular" href="#cardapio">Pular para o cardápio</a>

<div class="conteudo">
  <header>
    <div class="capa"><img src="imagens/capa.jpg" alt="Hambúrguer artesanal com batatas fritas" width="800" height="1200" fetchpriority="high" decoding="async"></div>
    <div class="perfil">
      <div class="logo" aria-hidden="true"><span id="sigla"></span></div>
      <h1 id="nome-loja"></h1>
      <p class="slogan" id="slogan"></p>
      <ul class="chips" id="chips" aria-label="Informações da loja"></ul>
    </div>
  </header>

  <div class="barra">
    <div class="busca" role="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <label class="so-leitor" for="busca">Buscar no cardápio</label>
      <input type="search" id="busca" placeholder="Buscar no cardápio" autocomplete="off" enterkeyhint="search">
    </div>
    <button type="button" class="btn-contorno" id="btn-pedidos">Meus Pedidos</button>
    <button type="button" class="btn-contorno" id="btn-taxa">Taxa e Tempo de Entrega</button>
  </div>

  <nav class="abas" id="abas" role="tablist" aria-label="Categorias do cardápio"></nav>
  <main id="cardapio" tabindex="-1">
    <div id="secoes" role="tabpanel"></div>
  </main>

  <footer class="rodape-loja" id="rodape-loja"></footer>
</div>

<noscript><p style="padding:24px;text-align:center">Ative o JavaScript para ver o cardápio e fazer o pedido.</p></noscript>

<!-- Aviso rápido ao adicionar item -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- Barra fixa do pedido -->
<div class="barra-pedido oculto" id="barra-pedido">
  <button type="button" id="btn-ver-pedido" aria-label="Ver pedido">
    <span id="barra-qtd"></span><span>Ver pedido</span><span id="barra-total"></span>
  </button>
</div>

<!-- Painel genérico (carrinho, checkout, informações) -->
<div class="fundo oculto" id="fundo">
  <div class="painel" role="dialog" aria-modal="true" aria-labelledby="painel-titulo">
    <button type="button" class="fechar" id="btn-fechar" aria-label="Fechar">×</button>
    <div id="painel-conteudo"></div>
  </div>
</div>

<script>
/* ============================================================
   1) DADOS DA LOJA  ← EDITE AQUI
   ============================================================ */
// >>> ALTERE AQUI O NÚMERO DO WHATSAPP (55 + DDD + número, só dígitos) <<<
const WHATSAPP_NUMERO = "5500000000000";

const LOJA = {
  nome: "BURGER MODELO",
  sigla: "BM",                                   // letras do logo redondo (2 a 3 letras)
  slogan: "Artesanal de verdade",
  telefone: "(00) 00000-0000",
  endereco: "Rua Exemplo, 123 – Centro",
  taxaEntrega: 5.00,
  tempoEntrega: "40 a 60 minutos",
  horario: { abre: "18:00", fecha: "23:30" }     // mostra "Aberto/Fechado" no topo. Use null para esconder.
};

/* ============================================================
   2) CARDÁPIO  ← EDITE AQUI (nomes, descrições, preços e fotos)
   "foto" é o nome do arquivo em imagens/ (sem o .jpg). Pode deixar vazio.
   "selo" é opcional: uma etiqueta dourada no produto (ex.: "Mais pedido").
   ============================================================ */
const CARDAPIO = [
  { categoria: "Hambúrguer Artesanal", itens: [
    { nome: "Hambúrguer da Casa", desc: "Pão brioche, blend 140g, cheddar, molho e alface. Assado na brasa.", preco: 10.00, foto: "hamburguer-casa" },
    { nome: "Hambúrguer Duplo",   desc: "Pão brioche, 2 blends 140g, 2 cheddar, molho e alface. Assado na brasa.", preco: 17.99, foto: "hamburguer-duplo", selo: "Mais pedido" },
    { nome: "Hambúrguer Triplo",  desc: "Pão brioche, 3 blends 140g, 3 cheddar, molho e alface. Assado na brasa.", preco: 23.99, foto: "hamburguer-triplo" },
    { nome: "Trio Artesanal",     desc: "Hambúrguer da casa, Coca-Cola lata e porção pequena de batata.", preco: 19.99, foto: "capa", selo: "Combo" },
    { nome: "Trio Duplo",         desc: "Hambúrguer duplo, refrigerante lata e porção pequena de batata.", preco: 26.99, foto: "trio-duplo", selo: "Combo" },
    { nome: "Trio Triplo",        desc: "Hambúrguer triplo, refrigerante lata e porção pequena de batata.", preco: 33.99, foto: "hamburguer-triplo", selo: "Combo" },
    { nome: "Dog no Molho",       desc: "Pão de leite Ninho, salsicha Perdigão, milho, batata, queijo e molho.", preco: 10.00, foto: "dog" },
    { nome: "Combo Família",      desc: "5 hambúrgueres, 1 batata grande com cheddar e bacon e 1 Guaraná Mineiro.", preco: 79.99, foto: "combo-familia", selo: "Para dividir" },
    { nome: "Sachê Heinz",        desc: "3 sachês de ketchup e 3 sachês de maionese.", preco: 2.00 }
  ]},
  { categoria: "Bebidas", itens: [
    { nome: "Coca-Cola Lata 310ml",       desc: "", preco: 6.00,  foto: "refri-lata" },
    { nome: "Coca-Cola Zero 310ml",       desc: "", preco: 6.00,  foto: "refri-lata" },
    { nome: "Guaraná 269ml",              desc: "", preco: 6.00,  foto: "refri-generico" },
    { nome: "Fanta Laranja 310ml",        desc: "", preco: 6.00,  foto: "refri-laranja" },
    { nome: "Schweppes 310ml",            desc: "", preco: 6.00,  foto: "refri-generico" },
    { nome: "Coca-Cola 600ml",            desc: "", preco: 9.00,  foto: "refri-2l" },
    { nome: "Mineiro 1,5L",               desc: "Guaraná Mineiro", preco: 9.00, foto: "refri-2l" },
    { nome: "Coca-Cola 2L",               desc: "", preco: 15.00, foto: "refri-2l" },
    { nome: "Coca-Cola Zero 2L",          desc: "", preco: 15.00, foto: "refri-2l" },
    { nome: "Suco de Uva Del Valle",      desc: "", preco: 8.00,  foto: "suco-uva" },
    { nome: "Suco de Uva Del Valle Lata", desc: "", preco: 8.00,  foto: "suco-uva" },
    { nome: "Suco de Maracujá Del Valle", desc: "", preco: 8.00,  foto: "suco-maracuja" },
    { nome: "Água sem Gás 500ml",         desc: "", preco: 3.50,  foto: "agua-sem-gas" },
    { nome: "Água com Gás 500ml",         desc: "", preco: 3.00,  foto: "agua-com-gas" },
    { nome: "Heineken Long Neck 330ml",   desc: "Venda proibida para menores de 18 anos.", preco: 11.00, foto: "cerveja" }
  ]},
  { categoria: "Batata Frita", itens: [
    { nome: "Porção de Batata Frita",                 desc: "Porção 400g", preco: 18.99, foto: "batata" },
    { nome: "Porção de Batata Frita Cheddar e Bacon", desc: "Porção 400g", preco: 24.99, foto: "batata-cheddar", selo: "Mais pedido" },
    { nome: "Porção de Batata Frita Queijo e Bacon",  desc: "Porção 400g", preco: 24.99, foto: "batata-cheddar" },
    { nome: "Batata Frita Pequena",                   desc: "Saquinho", preco: 5.99, foto: "batata-pequena" }
  ]}
];

/* ============================================================
   3) ESTADO E UTILITÁRIOS
   ============================================================ */
let carrinho = {};            // { "nome do item": { nome, preco, qtd } }
let primeiraVez = true;       // liga a animação de entrada dos cards
let categoriaAtiva = 0;       // aba aberta no momento (0 = primeira)
let ultimoFoco = null;
let temporizadorToast;
const CHAVE_CLIENTE = "burger-modelo-cliente";
const $ = (id) => document.getElementById(id);
const moeda = (v) => v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const itensCarrinho = () => Object.values(carrinho);
const subtotal = () => itensCarrinho().reduce((t, i) => t + i.preco * i.qtd, 0);
const totalQtd = () => itensCarrinho().reduce((t, i) => t + i.qtd, 0);
const slug = (s) => "cat-" + s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-");

// Guardar os dados do cliente só neste aparelho (nunca é enviado a lugar nenhum)
const lerCliente = () => { try { return JSON.parse(localStorage.getItem(CHAVE_CLIENTE)) || {}; } catch (e) { return {}; } };
const salvarCliente = (d) => { try { localStorage.setItem(CHAVE_CLIENTE, JSON.stringify(d)); } catch (e) { /* sem armazenamento: tudo bem */ } };

// "Aberto até 23:30" ou "Fechado · abre às 18:00" (só informativo: não bloqueia o pedido)
function statusLoja() {
  if (!LOJA.horario) return null;
  const min = (hhmm) => { const [h, m] = hhmm.split(":").map(Number); return h * 60 + m; };
  const abre = min(LOJA.horario.abre), fecha = min(LOJA.horario.fecha);
  const agora = new Date().getHours() * 60 + new Date().getMinutes();
  const aberto = abre < fecha ? agora >= abre && agora < fecha : agora >= abre || agora < fecha;   // 2ª forma: fecha depois da meia-noite
  return aberto ? { aberto, texto: `Aberto até ${LOJA.horario.fecha}` } : { aberto, texto: `Fechado · abre às ${LOJA.horario.abre}` };
}

// Dados estruturados para o Google (nome, endereço, cardápio e preços)
function dadosEstruturados() {
  const dados = {
    "@context": "https://schema.org", "@type": "Restaurant", name: LOJA.nome, telephone: LOJA.telefone,
    address: { "@type": "PostalAddress", streetAddress: LOJA.endereco }, servesCuisine: "Hambúrguer",
    hasMenu: { "@type": "Menu", hasMenuSection: CARDAPIO.map((c) => ({
      "@type": "MenuSection", name: c.categoria,
      hasMenuItem: c.itens.map((i) => ({ "@type": "MenuItem", name: i.nome, description: i.desc || undefined,
        offers: { "@type": "Offer", price: i.preco.toFixed(2), priceCurrency: "BRL" } }))
    })) }
  };
  const s = document.createElement("script");
  s.type = "application/ld+json";
  s.textContent = JSON.stringify(dados).replace(/</g, "\\u003c");
  document.head.appendChild(s);
}

/* ============================================================
   4) CARDÁPIO NA TELA
   ============================================================ */
function montarLoja() {
  document.title = LOJA.nome + " – Cardápio Online";
  $("nome-loja").textContent = LOJA.nome;
  $("sigla").textContent = LOJA.sigla;
  $("slogan").textContent = LOJA.slogan;
  $("rodape-loja").innerHTML =
    `<strong>${esc(LOJA.nome)}</strong><br>Telefone: ${esc(LOJA.telefone)}<br>Endereço: ${esc(LOJA.endereco)}`;

  const st = statusLoja();
  $("chips").innerHTML =
    (st ? `<li class="chip ${st.aberto ? "aberto" : ""}"><span class="ponto" aria-hidden="true"></span>${esc(st.texto)}</li>` : "") +
    `<li class="chip">Entrega em ${esc(LOJA.tempoEntrega)}</li><li class="chip">Taxa ${moeda(LOJA.taxaEntrega)}</li>`;

  $("abas").innerHTML = CARDAPIO.map((c, i) =>
    `<button type="button" role="tab" id="aba-${i}" class="aba" aria-controls="secoes" data-cat="${i}">${esc(c.categoria)}</button>`).join("") +
    '<span class="aba-barra" id="aba-barra" aria-hidden="true"></span>';
  document.querySelectorAll(".aba").forEach((b) => b.addEventListener("click", () => irParaAba(Number(b.dataset.cat))));

  desenharProdutos("");
  dadosEstruturados();
}

// Abre uma aba (e, se vier do teclado, leva o foco até ela)
function irParaAba(i, focar) {
  categoriaAtiva = i;
  $("busca").value = "";
  primeiraVez = true;                       // anima os cards da nova aba
  desenharProdutos("");
  if (focar) $("aba-" + i).focus();
  // se o topo do cardápio já rolou para fora da tela, volta até ele
  const topo = $("secoes").getBoundingClientRect().top;
  if (topo < 70) window.scrollBy({ top: topo - 70, behavior: "smooth" });
}

// Marca a aba aberta (ou nenhuma, enquanto o cliente está buscando) e move o sublinhado dourado
function marcarAba(buscando) {
  const abas = document.querySelectorAll(".aba");
  abas.forEach((b, i) => {
    const ativa = !buscando && i === categoriaAtiva;
    b.classList.toggle("ativa", ativa);
    b.setAttribute("aria-selected", ativa);
    b.tabIndex = i === categoriaAtiva ? 0 : -1;      // setas do teclado navegam entre as abas
  });
  posicionarIndicador();
}
function posicionarIndicador() {
  const barra = $("aba-barra"), ativa = document.querySelector(".aba.ativa"), nav = $("abas");
  if (!barra) return;
  if (!ativa) { barra.style.opacity = 0; return; }
  barra.style.opacity = 1;
  barra.style.width = ativa.offsetWidth + "px";
  barra.style.transform = `translateX(${ativa.offsetLeft}px)`;
  nav.scrollTo({ left: ativa.offsetLeft - (nav.clientWidth - ativa.offsetWidth) / 2, behavior: "smooth" });
}

function desenharProdutos(filtro) {
  const termo = filtro.trim().toLowerCase();
  const categorias = termo ? CARDAPIO : [CARDAPIO[categoriaAtiva]];   // com busca, procura em todas as abas
  marcarAba(Boolean(termo));

  const painel = $("secoes");
  if (termo) { painel.removeAttribute("aria-labelledby"); painel.setAttribute("aria-label", "Resultados da busca"); }
  else { painel.removeAttribute("aria-label"); painel.setAttribute("aria-labelledby", "aba-" + categoriaAtiva); }

  const html = categorias.map((cat) => {
    const itens = cat.itens.filter((i) => !termo || (i.nome + " " + i.desc).toLowerCase().includes(termo));
    if (!itens.length) return "";
    const idSecao = slug(cat.categoria);
    return `<section class="secao" aria-labelledby="t-${idSecao}">
      <h2 id="t-${idSecao}">${esc(cat.categoria.toUpperCase())}</h2>
      <ul class="lista">${itens.map((i, n) =>
        `<li><button type="button" class="produto${primeiraVez ? " anima" : ""}" style="--i:${n}" data-nome="${esc(i.nome)}" aria-label="Adicionar ${esc(i.nome)}, ${moeda(i.preco)}">
           <span class="texto">
             ${i.selo ? `<span class="selo">${esc(i.selo)}</span>` : ""}
             <span class="nome">${esc(i.nome)}</span>
             ${i.desc ? `<span class="desc">${esc(i.desc)}</span>` : '<span class="desc"></span>'}
             <span class="rodape"><span class="preco">${moeda(i.preco)}</span><span class="mais" aria-hidden="true">+</span></span>
           </span>
           ${i.foto ? `<span class="foto-caixa"><img class="foto" src="imagens/${esc(i.foto)}.jpg" alt="" loading="lazy" decoding="async" width="112" height="112"></span>` : ""}
         </button></li>`).join("")}</ul>
    </section>`;
  }).join("");
  painel.innerHTML = html || '<p class="sem-resultado">Nenhum produto encontrado para essa busca.</p>';
  document.querySelectorAll(".produto").forEach((b) => b.addEventListener("click", () => adicionar(b.dataset.nome)));
  // Se uma foto falhar, esconde só ela (o card continua bonito)
  document.querySelectorAll(".produto .foto").forEach((img) =>
    img.addEventListener("error", () => img.closest(".foto-caixa").remove()));
  primeiraVez = false;   // a animação de entrada roda só quando a aba muda
  atualizarContadores();
}

function adicionar(nome) {
  const item = CARDAPIO.flatMap((c) => c.itens).find((i) => i.nome === nome);
  if (!item) return;
  if (carrinho[nome]) carrinho[nome].qtd += 1;
  else carrinho[nome] = { nome, preco: item.preco, qtd: 1 };
  atualizarBarra();
  avisar(`✓ ${nome} adicionado`);
  const b = $("btn-ver-pedido");           // pequeno "pulo" na barra do pedido
  b.classList.remove("bump"); void b.offsetWidth; b.classList.add("bump");
}

// Mostra "2x" no cartão dos produtos que já estão no pedido
function atualizarContadores() {
  document.querySelectorAll(".produto").forEach((b) => {
    b.dataset.qtd = carrinho[b.dataset.nome] ? carrinho[b.dataset.nome].qtd : 0;
  });
}

function atualizarBarra() {
  const q = totalQtd();
  $("barra-pedido").classList.toggle("oculto", q === 0);
  $("barra-qtd").textContent = q + (q === 1 ? " item" : " itens");
  $("barra-total").textContent = moeda(subtotal());
  $("btn-ver-pedido").setAttribute("aria-label", `Ver pedido: ${q} ${q === 1 ? "item" : "itens"}, ${moeda(subtotal())}`);
  atualizarContadores();
}

function avisar(texto) {
  const t = $("toast");
  t.textContent = texto;
  t.classList.add("visivel");
  clearTimeout(temporizadorToast);
  temporizadorToast = setTimeout(() => t.classList.remove("visivel"), 1600);
}

/* ============================================================
   5) PAINÉIS: pedido, checkout, taxa, meus pedidos
   ============================================================ */
function abrirPainel(html) {
  if ($("fundo").classList.contains("oculto")) ultimoFoco = document.activeElement;
  $("painel-conteudo").innerHTML = html;
  $("fundo").classList.remove("oculto");
  document.body.classList.add("travado");
  $("btn-fechar").focus();
}
function fecharPainel() {
  if ($("fundo").classList.contains("oculto")) return;
  $("fundo").classList.add("oculto");
  document.body.classList.remove("travado");
  if (ultimoFoco && document.contains(ultimoFoco)) ultimoFoco.focus();
}

function painelPedido() {
  if (!itensCarrinho().length) { fecharPainel(); return; }
  const linhas = itensCarrinho().map((i) =>
    `<div class="linha"><div><strong>${esc(i.nome)}</strong><br>
       <span class="qtd"><button type="button" data-acao="-" data-nome="${esc(i.nome)}" aria-label="Diminuir ${esc(i.nome)}">−</button><span aria-live="polite">${i.qtd}</span><button type="button" data-acao="+" data-nome="${esc(i.nome)}" aria-label="Aumentar ${esc(i.nome)}">+</button></span></div>
     <strong>${moeda(i.preco * i.qtd)}</strong></div>`).join("");
  abrirPainel(`<h3 id="painel-titulo">Seu pedido</h3>${linhas}
    <div class="linha sem-borda"><span>Subtotal</span><span>${moeda(subtotal())}</span></div>
    <div class="linha sem-borda"><span>Taxa de entrega</span><span>${moeda(LOJA.taxaEntrega)}</span></div>
    <div class="linha sem-borda total"><span>Total</span><span>${moeda(subtotal() + LOJA.taxaEntrega)}</span></div>
    <button type="button" class="btn-principal" id="btn-continuar">Continuar</button>`);
  document.querySelectorAll("[data-acao]").forEach((b) => b.addEventListener("click", () => {
    const it = carrinho[b.dataset.nome];
    if (!it) return;
    it.qtd += b.dataset.acao === "+" ? 1 : -1;
    if (it.qtd <= 0) delete carrinho[b.dataset.nome];
    atualizarBarra();
    painelPedido();
  }));
  $("btn-continuar").addEventListener("click", painelCheckout);
}

function painelCheckout() {
  const c = lerCliente();
  abrirPainel(`<h3 id="painel-titulo">Entrega e pagamento</h3>
    <form id="form" novalidate>
      <label class="campo">Seu nome *<input id="f-nome" type="text" autocomplete="name" autocapitalize="words" enterkeyhint="next" aria-required="true" value="${esc(c.nome || "")}"></label>
      <label class="campo">Rua e número *<input id="f-rua" type="text" autocomplete="address-line1" autocapitalize="words" enterkeyhint="next" aria-required="true" value="${esc(c.rua || "")}"></label>
      <label class="campo">Bairro *<input id="f-bairro" type="text" autocomplete="address-level3" autocapitalize="words" enterkeyhint="next" aria-required="true" value="${esc(c.bairro || "")}"></label>
      <label class="campo">Complemento / referência *<input id="f-comp" type="text" autocomplete="address-line2" enterkeyhint="next" aria-required="true" value="${esc(c.comp || "")}"></label>
      <label class="campo">Forma de pagamento *
        <select id="f-pag" aria-required="true"><option value="">Selecione</option><option>Cartão de Crédito</option><option>Cartão de Débito</option><option>Pix</option><option>Dinheiro</option></select>
      </label>
      <label class="campo oculto" id="bloco-troco">Troco para quanto? *<input id="f-troco" type="text" inputmode="decimal" enterkeyhint="send" placeholder="Ex.: 50 (ou 0 se não precisa)"></label>
      <p class="msg-erro" id="msg-erro" role="alert"></p>
      <button type="submit" class="btn-principal btn-whats">Enviar pedido por WhatsApp</button>
      <p class="dica">Seus dados de entrega ficam salvos só neste aparelho, para o próximo pedido.</p>
    </form>`);
  $("f-pag").addEventListener("change", (e) => {
    $("bloco-troco").classList.toggle("oculto", e.target.value !== "Dinheiro");
  });
  $("form").addEventListener("submit", enviar);
}

function enviar(e) {
  e.preventDefault();
  const todos = ["f-nome", "f-rua", "f-bairro", "f-comp", "f-pag", "f-troco"];
  const campos = [["f-nome", "Nome"], ["f-rua", "Rua e número"], ["f-bairro", "Bairro"], ["f-comp", "Complemento / referência"], ["f-pag", "Forma de pagamento"]];
  if ($("f-pag").value === "Dinheiro") campos.push(["f-troco", "Troco"]);
  let erro = "", primeiro = null;
  todos.forEach((id) => $(id).removeAttribute("aria-invalid"));
  campos.forEach(([id, rotulo]) => {
    const vazio = $(id).value.trim() === "";
    if (vazio) $(id).setAttribute("aria-invalid", "true");
    if (vazio && !erro) { erro = `Preencha: ${rotulo}.`; primeiro = $(id); }
  });
  $("msg-erro").textContent = erro;
  if (erro) { primeiro.focus(); return; }
  if (!itensCarrinho().length) { $("msg-erro").textContent = "Seu pedido está vazio."; return; }

  const v = (id) => $(id).value.trim();
  salvarCliente({ nome: v("f-nome"), rua: v("f-rua"), bairro: v("f-bairro"), comp: v("f-comp") });
  const itens = itensCarrinho().map((i) => `• ${i.qtd}x ${i.nome} - ${moeda(i.preco * i.qtd)}`).join("\n");
  let msg = `*NOVO PEDIDO - ${LOJA.nome}*\n\nCliente: ${v("f-nome")}\n\n*Itens:*\n${itens}\n\n` +
    `Subtotal: ${moeda(subtotal())}\nTaxa de entrega: ${moeda(LOJA.taxaEntrega)}\n*Total: ${moeda(subtotal() + LOJA.taxaEntrega)}*\n\n` +
    `*Endereço:*\n${v("f-rua")}\nBairro: ${v("f-bairro")}\nComplemento: ${v("f-comp")}\n\n*Pagamento:* ${v("f-pag")}`;
  if (v("f-pag") === "Dinheiro") msg += `\nTroco para: ${v("f-troco")}`;
  window.open(`https://wa.me/${WHATSAPP_NUMERO}?text=${encodeURIComponent(msg)}`, "_blank", "noopener");
}

function painelTaxa() {
  abrirPainel(`<h3 id="painel-titulo">Taxa e tempo de entrega</h3><div class="info">
    <p><strong>Taxa fixa:</strong> ${moeda(LOJA.taxaEntrega)}</p>
    <p><strong>Tempo estimado:</strong> ${esc(LOJA.tempoEntrega)}</p>
    <p><strong>Endereço da loja:</strong> ${esc(LOJA.endereco)}</p></div>`);
}

function painelMeusPedidos() {
  abrirPainel(`<h3 id="painel-titulo">Meus pedidos</h3><div class="info"><p>Seus pedidos são enviados por WhatsApp.
    Para acompanhar um pedido, fale com a loja pelo telefone ${esc(LOJA.telefone)}.</p></div>`);
}

/* ============================================================
   6) EVENTOS E INICIALIZAÇÃO
   ============================================================ */
$("busca").addEventListener("input", (e) => desenharProdutos(e.target.value));
$("btn-ver-pedido").addEventListener("click", painelPedido);
$("btn-taxa").addEventListener("click", painelTaxa);
$("btn-pedidos").addEventListener("click", painelMeusPedidos);
$("btn-fechar").addEventListener("click", fecharPainel);
$("fundo").addEventListener("click", (e) => { if (e.target === $("fundo")) fecharPainel(); });

// Teclado nas abas: setas, Home e End (padrão de acessibilidade para abas)
$("abas").addEventListener("keydown", (e) => {
  const n = CARDAPIO.length;
  let i = categoriaAtiva;
  if (e.key === "ArrowRight") i = (i + 1) % n;
  else if (e.key === "ArrowLeft") i = (i - 1 + n) % n;
  else if (e.key === "Home") i = 0;
  else if (e.key === "End") i = n - 1;
  else return;
  e.preventDefault();
  irParaAba(i, true);
});

document.addEventListener("keydown", (e) => {
  if ($("fundo").classList.contains("oculto")) return;
  if (e.key === "Escape") { fecharPainel(); return; }
  // Mantém o Tab dentro do painel aberto
  if (e.key === "Tab") {
    const foco = [...$("fundo").querySelectorAll("button, input, select")].filter((el) => el.offsetParent !== null);
    if (!foco.length) return;
    const primeiro = foco[0], ultimo = foco[foco.length - 1];
    if (e.shiftKey && document.activeElement === primeiro) { e.preventDefault(); ultimo.focus(); }
    else if (!e.shiftKey && document.activeElement === ultimo) { e.preventDefault(); primeiro.focus(); }
  }
});

window.addEventListener("resize", posicionarIndicador);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(posicionarIndicador);

montarLoja();
</script>
